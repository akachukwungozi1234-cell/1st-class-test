<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/output.css" rel="stylesheet" />
  </head>
  <!-- background-image bg-[url("")] -->
  <!-- background-position  bg-center-->
  <!-- background-size   bg-cover--->
  <!-- background-repeat bg-no-repeat-->

  <body
    class="bg-[url('image.jpeg'')] bg-center bg-cover bg-no-repeat"
  >
    <main class="w-4/5 h-screen flex justify-center 
    items-center mx-auto gap-2">
      <div
        class="w-1/2 h-80 bg-gray-200 shadow-lg shadow-black
         flex flex-col gap-3"
      >
        <h3 class="text-center my-4">Contact Us</h3>
        <form class="flex flex-col">
          <!-- border: 1px solid gray -->
          <input
            type="text"
            placeholder="Enter Your Name"
            class="w-3/4 border border-gray-700 rounded-sm mx-auto mb-2 text-sm p-1 bg-white"
          />
          <input
            type="email"
            placeholder="Enter A Valid Email Address"
            class="w-3/4 border border-gray-700 rounded-sm mx-auto mb-2 text-sm p-1 bg-white"
          />
          <textarea
            placeholder="Enter A Text"
            class="w-3/4 border border-gray-700 rounded-sm mx-auto mb-2 text-sm p-2 bg-white"
          >
          </textarea>
          <button
            class="bg-amber-500 text-white p-2 mx-auto w-3/4 rounded-lg mt-2"
          >
            Submit
          </button>
        </form>
      </div>
      <div class="w-1/2 h-80 bg-white shadow-lg shadow-black">1
        <h1 class="text-center my-3.5 ">CONTACT US</h1>
      </div>
    </main>
  </body>
</html>
